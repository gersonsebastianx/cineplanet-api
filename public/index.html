<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Qué quieres ver?</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#fff; --ink:#10233f; --muted:#6b7c96; --line:#dde4ee;
    --blue:#104687; --blue-soft:#e8effa; --red:#e8394a; --pick:#1f5fd0;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0e1420; --card:#161f30; --ink:#e6edf9; --muted:#8fa1bd; --line:#26324a;
          --blue:#5689cf; --blue-soft:#1b2740;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;min-height:100dvh}
  header{padding:18px 20px 10px;text-align:center}
  header h1{margin:0;font-size:19px;font-weight:600}
  header p{margin:4px 0 0;color:var(--muted);font-size:13px}
  main{flex:1;overflow-y:auto;padding:12px 16px 8px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:min(560px,100%);width:fit-content;padding:12px 16px;border-radius:16px;white-space:pre-wrap}
  .yo{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
  .bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
  .card{align-self:flex-start;width:min(560px,100%);background:var(--card);
    border:1px solid var(--line);border-radius:16px;padding:16px;overflow:hidden}
  .card h2{margin:0 0 2px;font-size:17px;font-weight:600}
  .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:500}
  .screen{text-align:center;font-size:10px;letter-spacing:.2em;color:var(--muted)}
  .screen div{height:4px;border-radius:2px;background:var(--line);margin:5px auto 14px;max-width:70%}
  .map{overflow-x:auto;padding-bottom:4px}
  .grid{display:inline-block;min-width:100%}
  .row{display:flex;gap:2px;align-items:center;justify-content:center;margin:2px 0}
  .lbl{width:14px;flex:none;font-size:10px;color:var(--muted);text-align:center}
  .s,.gap{width:19px;height:19px;flex:none;border-radius:50%;font-size:9px;
    display:flex;align-items:center;justify-content:center}
  .gap{visibility:hidden}
  .free{border:1.5px solid var(--blue);color:var(--muted)}
  .taken{background:var(--red);color:#fff}
  .pick{background:var(--pick);color:#fff;font-weight:600}
  .acc{border:1.5px dashed var(--muted);color:var(--muted)}
  .legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:11px;color:var(--muted)}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;border-radius:50%;display:block}
  .cta{display:block;margin-top:14px;padding:13px;border-radius:12px;background:var(--blue);
    color:#fff;text-align:center;font-weight:600;text-decoration:none}
  .nota{margin-top:8px;font-size:12px;color:var(--muted);text-align:center}
  .otras{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:13px}
  .otras a{color:var(--blue);text-decoration:none;margin-right:12px;white-space:nowrap;display:inline-block;padding:3px 0}
  form{display:flex;gap:8px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));
    background:var(--card);border-top:1px solid var(--line)}
  input{flex:1;min-width:0;padding:13px 15px;border-radius:999px;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);font-size:16px}
  input:focus{outline:2px solid var(--blue);outline-offset:-1px}
  button{padding:0 20px;border:0;border-radius:999px;background:var(--blue);color:#fff;
    font-size:16px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5}
  .ejemplos{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:0 16px 10px}
  .ejemplos button{background:transparent;border:1px solid var(--line);color:var(--muted);
    font-size:12px;font-weight:400;padding:6px 12px;border-radius:999px}
</style>
</head>
<body>
<header>
  <h1>¿Qué quieres ver?</h1>
  <p>Escríbelo como se lo dirías a un amigo</p>
</header>

<main id="chat">
  <div class="bot msg">Dime la película, el cine y cuándo. Por ejemplo: «quiero ver Toy Story hoy entre 4 y 6 en el Real Plaza Salaverry».</div>
</main>

<div class="ejemplos" id="ejemplos">
  <button type="button">La Odisea mañana en la tarde en Salaverry</button>
  <button type="button">Toy Story hoy en Trujillo</button>
</div>

<form id="form">
  <input id="texto" autocomplete="off" placeholder="Escribe aquí…" aria-label="Tu consulta">
  <button id="enviar">Buscar</button>
</form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const texto = document.getElementById('texto');
const enviar = document.getElementById('enviar');

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const abajo = () => chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });

function decir(texto, quien = 'bot') {
  chat.append(el('div', `${quien} msg`, texto));
  abajo();
}

function mapaHtml(mapa, elegidas) {
  const cont = el('div', 'map');
  const grid = el('div', 'grid');
  for (const fila of mapa.filas) {
    const row = el('div', 'row');
    const tag = () => el('span', 'lbl', fila.fila);
    row.append(tag());
    for (const celda of fila.celdas) {
      if (!celda) { row.append(el('i', 'gap')); continue; }
      const clase = celda.acc ? 'acc' : elegidas.has(celda.id) ? 'pick' : celda.libre ? 'free' : 'taken';
      const s = el('span', `s ${clase}`, celda.n);
      s.title = celda.id;
      row.append(s);
    }
    row.append(tag());
    grid.append(row);
  }
  cont.append(grid);
  return cont;
}

function tarjeta(r) {
  const card = el('div', 'card');
  const f = r.funcion;
  card.append(el('h2', null, `${f.cine} · ${f.hora}`));
  card.append(el('div', 'sub', `${r.pedido.pelicula} · ${f.fechaTexto} · ${f.sala}`));

  const chips = el('div', 'chips');
  for (const t of [...f.formatos, ...f.idiomas]) chips.append(el('span', 'chip', t));
  card.append(chips);

  const elegidas = new Set();
  if (r.mapa) {
    const mejor = r.mapa.sugeridas[0];
    if (mejor) mejor.seats.forEach((s) => elegidas.add(s));
    const pantalla = el('div', 'screen', 'PANTALLA');
    pantalla.append(el('div'));
    card.append(pantalla, mapaHtml(r.mapa, elegidas));
    const leyenda = el('div', 'legend');
    for (const [cls, txt] of [['free','Libre'],['taken','Ocupada'],['pick','Sugerida'],['acc','Silla de ruedas']]) {
      const s = el('span');
      const i = el('i');
      i.className = '';
      i.style.cssText = cls === 'taken' ? 'background:var(--red)'
        : cls === 'pick' ? 'background:var(--pick)'
        : cls === 'acc' ? 'border:1.5px dashed var(--muted)'
        : 'border:1.5px solid var(--blue)';
      s.append(i, document.createTextNode(txt));
      leyenda.append(s);
    }
    card.append(leyenda);
  }

  const cta = el('a', 'cta', elegidas.size ? `Ir a comprar — te sugiero ${[...elegidas].join(' y ')}` : 'Ir a comprar');
  cta.href = f.link;
  cta.target = '_blank';
  cta.rel = 'noopener';
  card.append(cta);
  card.append(el('div', 'nota', r.mapa
    ? `${r.mapa.libres} de ${r.mapa.total} butacas libres · eliges asientos y pagas en Cineplanet · tienes 5 minutos desde que abres`
    : 'Eliges asientos y pagas en Cineplanet'));

  if (r.otras.length) {
    const otras = el('div', 'otras');
    otras.append(el('span', null, 'Otras funciones: '));
    for (const o of r.otras) {
      const a = el('a', null, `${o.fechaTexto} ${o.hora}`);
      a.href = o.link; a.target = '_blank'; a.rel = 'noopener';
      otras.append(a);
    }
    card.append(otras);
  }
  return card;
}

function responder(r) {
  if (r.estado === 'falta') return decir(r.pregunta);
  if (r.estado === 'sin-cartelera' || r.estado === 'error') return decir(r.mensaje);

  const p = r.pedido;
  if (r.ajuste === 'hora') {
    decir(`No hay ${p.pelicula} ${p.ventana ?? 'a esa hora'} en ${p.cine}. Lo más cercano:`);
  } else if (r.ajuste === 'dia' || r.ajuste === 'dia-y-hora') {
    decir(`${p.fechaPedida ?? 'Ese día'} no hay ${p.pelicula} en ${p.cine}. La siguiente:`);
  } else if (r.ajuste === 'ultimo-dia') {
    decir(`${p.pelicula} ya no llega hasta ${p.fechaPedida ?? 'esa fecha'} en ${p.cine}. La última función:`);
  } else {
    decir('Encontré esto:');
  }
  chat.append(tarjeta(r));
  abajo();
}

async function consultar(valor) {
  decir(valor, 'yo');
  texto.value = '';
  enviar.disabled = true;
  const pensando = el('div', 'bot msg', 'Buscando…');
  chat.append(pensando);
  abajo();
  let datos = null;
  try {
    const res = await fetch('/api/consulta', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ texto: valor }),
    });
    datos = await res.json();
  } catch {
    // Sólo un fallo de red llega hasta acá; un error al dibujar la respuesta
    // no debe disfrazarse de conexión caída.
    decir('Se cayó la conexión. Intenta de nuevo.');
  } finally {
    pensando.remove();
    enviar.disabled = false;
    texto.focus();
  }
  if (datos) responder(datos);
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const valor = texto.value.trim();
  if (valor) consultar(valor);
});

document.getElementById('ejemplos').addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON') consultar(e.target.textContent);
});
</script>
</body>
</html>
