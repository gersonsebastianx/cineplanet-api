# Revisión automática, dos veces al día, sin depender de ninguna computadora
# encendida. No razona ni arregla —eso es trabajo del agente—: es la red que
# avisa cuando algo se rompió solo, que pasa más seguido de lo que parece.
# En diez días la cartelera se llevó por delante dos películas y con ellas
# pruebas que nadie había tocado.
#
# La clave `on` va entrecomillada a propósito: sin comillas, YAML la lee como
# el booleano `true` y GitHub se queda sin disparadores — el workflow arranca y
# muere en cero segundos, con el nombre del archivo en vez del suyo.

name: Revisión

"on":
  # 09:00 y 21:00 en Lima (UTC-5). GitHub programa en UTC.
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Sin dependencias: no hay nada que instalar.
      # Antes de evaluar nada, se pregunta si Cineplanet está en pie: un build
      # rojo por algo que no rompimos enseña a ignorar el rojo.
      - name: Cineplanet responde
        id: cineplanet
        run: node test/cineplanet-vivo.mjs

      - name: Pruebas
        if: steps.cineplanet.outputs.vivo == 'true'
        run: npm test

      # Recorre las 43 sedes buscando bucles, callejones, afirmaciones
      # inventadas y enlaces que no corresponden a la función que anuncian.
      - name: Barrido
        if: steps.cineplanet.outputs.vivo == 'true'
        run: npm run barrido

      - name: Cineplanet no respondia
        if: steps.cineplanet.outputs.vivo != 'true'
        run: echo "::notice::Revision saltada porque Cineplanet no responde. No es un fallo de este repositorio."
